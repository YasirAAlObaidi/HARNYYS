# yyai on one box: Postgres, one-off migrations, the API server, the worker, and Caddy with the staff web app.
# Optional: a Cloudflare tunnel for the WhatsApp webhook (profile "tunnel").
#
# Run from the repo root:
#   cp deploy/.env.example deploy/.env      # then fill it in
#   docker compose -f deploy/compose.yaml up -d --build
#
# Only Caddy is published (docs/decisions/0014). The server, worker and Postgres have no ports on the host.
# The model server is NOT in this file: it runs outside Docker (docs/decisions/0004).
# The nightly backup job comes later.

name: yyai

# Settings shared by every service that runs our image.
x-app: &app
  image: yyai-server:dev
  build:
    context: ../apps/server
  # deploy/.env, next to this file. Holds the secrets that config.yaml reads as ${NAME}.
  env_file: .env
  environment:
    YYAI_CONFIG: /config/config.yaml
  volumes:
    # The client's folder: config.yaml and catalogue.json. Read-only, because the app never writes to it.
    - ${YYAI_CLIENT_DIR:-./clients/kahraman}:/config:ro

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: yyai
      POSTGRES_DB: yyai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No "ports": Postgres is reachable only from the other services on this Compose network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yyai -d yyai"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Runs once per `up`, applies any new database migrations, then exits.
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
    # No "ports": reached only through Caddy (and the tunnel, for the WhatsApp webhook).
    environment:
      YYAI_CONFIG: /config/config.yaml
      # Trust X-Forwarded-For, so login throttling sees each browser's address and not Caddy's. Safe because
      # only Caddy and cloudflared can reach this port, on the Compose network.
      FORWARDED_ALLOW_IPS: "*"
    restart: unless-stopped
    # The slim image has no curl, so the check uses Python. A non-2xx answer raises and fails the check.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *app
    command: ["python", "-m", "yyai.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # Only needed on a Linux host when config.yaml points at a model server on the host itself
    # (base_url http://host.docker.internal:...). Docker Desktop and Colima resolve that name already.
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

  # The staff web app and the only published service. Serves the app and sends /api/* to the server.
  # Local testing: http://localhost:8080 on this machine. On a client box: HTTPS on the client's subdomain
  # (see "Web app" in deploy/README.md and the PLACEHOLDER in apps/web/Caddyfile).
  caddy:
    image: yyai-web:dev
    build:
      context: ../apps/web
    environment:
      YYAI_SITE: ${YYAI_SITE:-http://:8080}
      YYAI_TLS: ${YYAI_TLS:-none}
      YYAI_DNS_PROVIDER: ${YYAI_DNS_PROVIDER:-}
      YYAI_DNS_API_TOKEN: ${YYAI_DNS_API_TOKEN:-}
    ports:
      # This machine only, until the box has its subdomain and certificate. Then set YYAI_HTTPS_BIND in
      # deploy/.env to "443" (all addresses) or "<LAN address>:443" so staff on the office network can reach it.
      - "${YYAI_HTTP_BIND:-127.0.0.1:8080}:8080"
      - "${YYAI_HTTPS_BIND:-127.0.0.1:8443}:8443"
    volumes:
      - caddy_data:/data # certificates
    tmpfs:
      - /config
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  # Public webhook tunnel. Off by default; turn it on with:
  #   docker compose -f deploy/compose.yaml --profile tunnel up -d
  #
  # In the Cloudflare dashboard (Zero Trust > Networks > Tunnels > your tunnel > Public hostname),
  # route ONLY the path  /api/webhooks/whatsapp*  of the public hostname to  http://server:8000
  # Add no other route. Everything else stays private on the office network.
  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:2026.11.2
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
